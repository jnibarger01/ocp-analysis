<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oil Change Package Break-Even Analysis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet" />

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>

  <style>
    :root {
      --hag-blue: #00558C;
      --hag-blue-dark: #003e67;
      --hag-blue-deep: #002a46;
      --hag-blue-light: #e6f0f7;
      --hag-black: #000000;
      --hag-white: #ffffff;
      --hag-text: #111827;
      --hag-muted: #5f6b7a;
      --hag-rule: rgba(0, 85, 140, 0.16);
      --success: #166534;
      --danger: #991b1b;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Montserrat", sans-serif;
      color: var(--hag-text);
      background:
        radial-gradient(circle at top left, rgba(0, 85, 140, 0.42), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(0, 85, 140, 0.28), transparent 36rem),
        linear-gradient(135deg, #02040a 0%, #05070c 45%, #000000 100%);
      padding: 28px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent 85%);
      z-index: -1;
    }

    button,
    input {
      font-family: inherit;
    }

    .app-shell {
      max-width: 1180px;
      margin: 0 auto;
    }

    .hero {
      position: relative;
      min-height: 330px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(135deg, rgba(0, 85, 140, 0.92), rgba(0, 31, 52, 0.96)),
        linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.16), transparent 38%),
        radial-gradient(circle at 78% 36%, rgba(255,255,255,0.18), transparent 22rem);
      pointer-events: none;
      z-index: 1;
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      opacity: 0.82;
    }

    .hero-canvas canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      min-height: 330px;
      padding: 34px 38px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 32px;
      align-items: center;
    }

    .brand-lockup {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .brand-mark {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      font-weight: 900;
      font-style: italic;
      color: var(--hag-white);
      letter-spacing: -0.05em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .brand-wordmark {
      color: var(--hag-white);
      line-height: 1;
    }

    .brand-wordmark strong {
      display: block;
      font-size: 1.52rem;
      font-weight: 800;
      font-style: italic;
      letter-spacing: 0.045em;
      text-transform: uppercase;
    }

    .brand-wordmark span {
      display: block;
      margin-top: 6px;
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.62);
    }

    .hero h1 {
      max-width: 680px;
      color: var(--hag-white);
      font-size: clamp(2rem, 4.2vw, 4.7rem);
      line-height: 0.96;
      letter-spacing: -0.07em;
      font-weight: 800;
      font-style: italic;
      text-transform: uppercase;
    }

    .hero p {
      max-width: 620px;
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.77);
      font-size: 1rem;
      line-height: 1.8;
      font-weight: 400;
    }

    .hero-stat {
      justify-self: end;
      width: min(100%, 380px);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-lg);
      background: rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(16px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }

    .hero-stat-label {
      color: rgba(255, 255, 255, 0.58);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 10px;

    .hero-stat-value {
      color: var(--hag-white);
      font-size: 3.4rem;
      line-height: 1;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.07em;
    }

    .hero-stat-sub {
      margin-top: 10px;
      color: rgba(255,255,255,0.74);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .main-card {
      margin-top: -36px;
      position: relative;
      z-index: 4;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: var(--radius-xl);
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .main-card-inner {
      padding: 28px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 18px;
    }

    .section-kicker {
      font-size: 0.66rem;
      color: var(--hag-blue);
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .section-title {
      margin-top: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--hag-text);

    .section-note {
      color: var(--hag-muted);
      font-size: 0.82rem;
      line-height: 1.55;
      max-width: 410px;
      text-align: right;
    }

    .input-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .field {
      padding: 18px;
      border: 1px solid var(--hag-rule);
      border-radius: var(--radius-lg);
      background:

      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .field:focus-within {
      transform: translateY(-2px);
      border-color: rgba(0, 85, 140, 0.42);
      box-shadow: 0 14px 34px rgba(0, 85, 140, 0.13);
    }

    .field label {
      display: block;
      color: var(--hag-muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .money-input {
      position: relative;
    }

    .money-input span {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      color: var(--hag-blue);
      font-size: 1.25rem;
      font-weight: 800;
    }

    .money-input input {
      width: 100%;
      border: 0;
      border-bottom: 2px solid rgba(0, 85, 140, 0.28);
      background: transparent;
      padding: 5px 0 7px 25px;
      color: var(--hag-text);
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.055em;
      outline: none;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .metric-card {
      position: relative;
      overflow: hidden;
      min-height: 170px;
      padding: 20px;
      border-radius: var(--radius-lg);
      color: var(--hag-white);
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.18), transparent 12rem),
        linear-gradient(135deg, #050505, #111827);
      box-shadow: 0 18px 40px rgba(0,0,0,0.14);
    }

    .metric-card.blue {
      background:
        radial-gradient(circle at top right, rgba(255,255,255,0.2), transparent 12rem),
        linear-gradient(135deg, var(--hag-blue), var(--hag-blue-deep));
    }

    .metric-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 4px;
      width: 100%;
      background: var(--hag-blue);
    }

    .metric-card.blue::before {
      background: var(--hag-white);
    }

    .metric-label {
      position: relative;
      z-index: 1;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.63);
      margin-bottom: 16px;
    }

    .metric-value {
      position: relative;
      z-index: 1;
      font-size: clamp(2.05rem, 4vw, 3.2rem);
      line-height: 0.95;
      font-weight: 800;
      font-style: italic;
      letter-spacing: -0.07em;
    }

    .metric-subtitle {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      color: rgba(255, 255, 255, 0.66);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .analysis-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(360px, 0.85fr);
      gap: 16px;
      align-items: stretch;
    }

    .panel {
      border: 1px solid var(--hag-rule);
      border-radius: var(--radius-lg);
      background: var(--hag-white);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--hag-rule);
      background: linear-gradient(180deg, #ffffff, #f7fbfd);
    }

    .panel-header h2 {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--hag-blue);
      letter-spacing: 0.17em;
      text-transform: uppercase;
    }

    .chart-wrap {
      padding: 18px 20px 22px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 300px;
    }

    .chart-axis {
      stroke: rgba(17, 24, 39, 0.24);
      stroke-width: 1;
    }

    .chart-grid {
      stroke: rgba(0, 85, 140, 0.11);
      stroke-width: 1;
    }

    .chart-line-fixed {
      fill: none;
      stroke: var(--hag-blue);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-line-ppv {
      fill: none;
      stroke: #000000;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-dot-fixed {
      fill: var(--hag-blue);
      stroke: #ffffff;
      stroke-width: 3;
    }

    .chart-dot-ppv {
      fill: #000000;
      stroke: #ffffff;
      stroke-width: 3;
    }

    .chart-label {
      fill: var(--hag-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .chart-money {
      fill: rgba(17, 24, 39, 0.72);
      font-size: 11px;
      font-weight: 700;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 8px;
      color: var(--hag-muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-swatch {
      width: 22px;
      height: 4px;
      border-radius: 999px;
      background: var(--hag-blue);
    }

    .legend-swatch.black {
      background: #000000;
    }

    .summary {
      padding: 20px;
      color: var(--hag-white);
      background:
        radial-gradient(circle at top right, rgba(0, 85, 140, 0.5), transparent 16rem),
        linear-gradient(135deg, #050505, #101827);
      min-height: 100%;
    }

    .summary-eyebrow {
      color: rgba(255, 255, 255, 0.54);
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .summary p {
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.82;
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    .summary strong {
      color: #ffffff;
      font-weight: 800;
    }

    .callout {
      margin-top: 16px;
      padding: 16px;
      border-left: 4px solid var(--hag-blue);
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.78);
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .table-panel {
      margin-top: 16px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th {
      padding: 13px 16px;
      background: var(--hag-blue);
      color: var(--hag-white);
      text-align: left;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--hag-rule);
      color: var(--hag-text);
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr.break-even-row td {
      background: var(--hag-blue-light);
      color: var(--hag-blue-dark);
      font-weight: 800;
    }

    .positive {
      color: var(--success);
      font-weight: 800;
    }

    .negative {
      color: var(--danger);
      font-weight: 800;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 28px;
      border-top: 1px solid var(--hag-rule);
      background: #f7fbfd;
      color: var(--hag-muted);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .footer span:last-child {
      color: var(--hag-blue);
    }

    @media (max-width: 980px) {
      .hero-content,
      .analysis-grid {
        grid-template-columns: 1fr;
      }

      .hero-stat {
        justify-self: stretch;
      }

      .section-head {
        align-items: start;
        flex-direction: column;
      }

      .section-note {
        text-align: left;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .hero-content {
        padding: 26px 22px;
      }

      .brand-lockup {
        margin-bottom: 26px;
      }

      .main-card-inner {
        padding: 18px;
      }

      .input-panel {
        grid-template-columns: 1fr;
      }

      .footer {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }

      body::before,
      .hero-canvas {
        display: none;
      }

      .hero,
      .main-card,
      .metric-card,
      .panel {
        box-shadow: none;
      }

      .hero {
        border-radius: 0;
      }

      .main-card {
        margin-top: 0;
        border-radius: 0;
      }

      .input-panel {
        display: none;
      }

      .analysis-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        background: #000000;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState } = React;

    const SERVICE_COUNT = 6;

    function money(value) {
      if (!Number.isFinite(value)) return "$0.00";
      const sign = value < 0 ? "-" : "";
      return `${sign}$${Math.abs(value).toFixed(2)}`;
    }

    function ordinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return n + (s[(v - 20) % 10] || s[v] || s[0]);
    }

    function useThreeBackground() {
      const mountRef = useRef(null);

      useEffect(() => {
        const mount = mountRef.current;
        if (!mount || !window.THREE) return;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({
          alpha: true,
          antialias: true
        });

        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        mount.appendChild(renderer.domElement);

        const group = new THREE.Group();
        scene.add(group);

        const particleCount = 760;
        const positions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
          const radius = 1.6 + Math.random() * 1.9;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);

          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
          positions[i * 3 + 2] = radius * Math.cos(phi);
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

        const particleMaterial = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.018,
          transparent: true,
          opacity: 0.58
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        group.add(particles);

        const ringMaterial = new THREE.LineBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.16
        });

        const makeRing = (scale, rotation) => {
          const curve = new THREE.EllipseCurve(0, 0, scale, scale * 0.58, 0, 2 * Math.PI, false, 0);
          const points = curve.getPoints(160);
          const geometry = new THREE.BufferGeometry().setFromPoints(
            points.map(point => new THREE.Vector3(point.x, point.y, 0))
          );

          const ring = new THREE.LineLoop(geometry, ringMaterial);
          ring.rotation.x = rotation.x;
          ring.rotation.y = rotation.y;
          ring.rotation.z = rotation.z;
          return ring;
        };

        group.add(makeRing(2.35, { x: 0.7, y: 0.12, z: -0.3 }));
        group.add(makeRing(1.9, { x: -0.55, y: 0.45, z: 0.52 }));
        group.add(makeRing(1.45, { x: 0.25, y: -0.76, z: 0.08 }));

        const resize = () => {
          const width = mount.clientWidth || 1;
          const height = mount.clientHeight || 1;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        };

        resize();
        window.addEventListener("resize", resize);

        let frameId;
        const animate = () => {
          group.rotation.y += 0.0016;
          group.rotation.x += 0.0007;
          particles.rotation.z -= 0.0008;

          renderer.render(scene, camera);
          frameId = requestAnimationFrame(animate);
        };

        animate();

        return () => {
          cancelAnimationFrame(frameId);
          window.removeEventListener("resize", resize);
          renderer.dispose();
          particleGeometry.dispose();
          particleMaterial.dispose();
          ringMaterial.dispose();
          mount.innerHTML = "";
        };
      }, []);

      return mountRef;
    }

    function Hero({ breakEven, roundUp }) {
      const canvasRef = useThreeBackground();

      return (
        <section className="hero">
          <div className="hero-canvas" ref={canvasRef}></div>

          <div className="hero-content">
            <div>
              <div className="brand-lockup">
                <div className="brand-mark">H</div>
                <div className="brand-wordmark">
                  <strong>Hendrick™</strong>
                  <span>Automotive Group</span>
                </div>
              </div>

              <h1>Oil Change Package Break-Even Analysis</h1>
              <p>
                A cleaner way to show when a prepaid six-service package pays for itself,
                how much the customer saves, and why the math is not just dealership wizard fog.
              </p>
            </div>

            <div className="hero-stat">
              <div className="hero-stat-label">Break-even moment</div>
              <div className="hero-stat-value">
                {Number.isFinite(breakEven) ? ordinal(roundUp) : "—"}
              </div>
              <div className="hero-stat-sub">
                {Number.isFinite(breakEven)
                  ? `The customer crosses break-even during the ${ordinal(roundUp)} service.`
                  : "Enter valid pricing to calculate the break-even service."}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function MoneyField({ id, label, value, onChange }) {
      return (
        <div className="field">
          <label htmlFor={id}>{label}</label>
          <div className="money-input">
            <span>$</span>
            <input
              id={id}
              type="number"
              min="0"
              step="0.01"
              value={value}
              onChange={event => onChange(event.target.value)}
            />
          </div>
        </div>
      );
    }

    function MetricCard({ label, value, subtitle, blue }) {
      return (
        <div className={`metric-card ${blue ? "blue" : ""}`}>
          <div className="metric-label">{label}</div>
          <div className="metric-value">{value}</div>
          <div className="metric-subtitle">{subtitle}</div>
        </div>
      );
    }

    function CostChart({ rows, packagePrice, perVisitCost }) {
      const chart = useMemo(() => {
        const width = 760;
        const height = 340;
        const left = 58;
        const right = 28;
        const top = 26;
        const bottom = 52;

        const plotW = width - left - right;
        const plotH = height - top - bottom;

        const visits = rows.filter(row => row.visit > 0);
        const maxValue = Math.max(packagePrice, perVisitCost * SERVICE_COUNT, 1) * 1.14;

        const x = visit => left + ((visit - 1) / (SERVICE_COUNT - 1)) * plotW;
        const y = value => top + plotH - (value / maxValue) * plotH;

        const fixedPoints = visits.map(row => `${x(row.visit)},${y(row.prepaid)}`).join(" ");
        const ppvPoints = visits.map(row => `${x(row.visit)},${y(row.payPerVisit)}`).join(" ");

        const gridValues = [0, 0.25, 0.5, 0.75, 1].map(ratio => maxValue * ratio);

        return {
          width,
          height,
          left,
          right,
          top,
          bottom,
          plotW,
          plotH,
          maxValue,
          visits,
          gridValues,
          x,
          y,
          fixedPoints,
          ppvPoints
        };
      }, [rows, packagePrice, perVisitCost]);

      return (
        <div className="panel">
          <div className="panel-header">
            <h2>Cost Comparison — Visits 1–6</h2>
          </div>

          <div className="chart-wrap">
            <svg className="chart-svg" viewBox={`0 0 ${chart.width} ${chart.height}`} role="img">
              {chart.gridValues.map((value, index) => {
                const y = chart.y(value);
                return (
                  <g key={index}>
                    <line
                      className="chart-grid"
                      x1={chart.left}
                      x2={chart.width - chart.right}
                      y1={y}
                      y2={y}
                    />
                    <text
                      className="chart-money"
                      x={chart.left - 12}
                      y={y + 4}
                      textAnchor="end"
                    >
                      ${Math.round(value)}
                    </text>
                  </g>
                );
              })}

              <line
                className="chart-axis"
                x1={chart.left}
                x2={chart.width - chart.right}
                y1={chart.top + chart.plotH}
                y2={chart.top + chart.plotH}
              />
              <line
                className="chart-axis"
                x1={chart.left}
                x2={chart.left}
                y1={chart.top}
                y2={chart.top + chart.plotH}
              />

              <polyline className="chart-line-fixed" points={chart.fixedPoints} />
              <polyline className="chart-line-ppv" points={chart.ppvPoints} />

              {chart.visits.map(row => (
                <g key={`dots-${row.visit}`}>
                  <circle
                    className="chart-dot-fixed"
                    cx={chart.x(row.visit)}
                    cy={chart.y(row.prepaid)}
                    r="6"
                  />
                  <circle
                    className="chart-dot-ppv"
                    cx={chart.x(row.visit)}
                    cy={chart.y(row.payPerVisit)}
                    r="6"
                  />
                  <text
                    className="chart-label"
                    x={chart.x(row.visit)}
                    y={chart.height - 22}
                    textAnchor="middle"
                  >
                    Visit {row.visit}
                  </text>
                </g>
              ))}
            </svg>

            <div className="legend">
              <span className="legend-item">
                <span className="legend-swatch"></span>
                Prepaid Package Fixed Cost
              </span>
              <span className="legend-item">
                <span className="legend-swatch black"></span>
                Pay-Per-Visit Running Total
              </span>
            </div>
          </div>
        </div>
      );
    }

    function Summary({ breakEven, roundUp, costPerService, totalSavings, savingsPct, perVisitCost }) {
      const valid = Number.isFinite(breakEven);
      const avgSavings = perVisitCost - costPerService;
      const savesMoney = totalSavings >= 0;

      return (
        <div className="summary">
          <div className="summary-eyebrow">The Bottom Line</div>

          {!valid ? (
            <p>
              Enter a valid package price and pay-per-visit cost to calculate the break-even point.
            </p>
          ) : (
            <>
              <p>
                The package breaks even after <strong>{breakEven.toFixed(2)} visits</strong>, which means
                the customer effectively crosses break-even during the <strong>{ordinal(roundUp)} service</strong>.
              </p>

              <p>
                The prepaid package lowers the effective oil-change cost to{" "}
                <strong>{money(costPerService)}</strong> per service. That is an average difference of{" "}
                <strong>{money(avgSavings)}</strong> per visit compared with pay-per-visit pricing.
              </p>

              <p>
                {savesMoney ? (
                  <>
                    Using all six services saves <strong>{money(totalSavings)}</strong>, an effective{" "}
                    <strong>{savingsPct.toFixed(1)}% discount</strong> versus paying one visit at a time.
                  </>
                ) : (
                  <>
                    At this pay-per-visit price, the package costs{" "}
                    <strong>{money(Math.abs(totalSavings))} more</strong> over six services. So no, the package
                    is not magically a deal just because someone put it in a box.
                  </>
                )}
              </p>

              <div className="callout">
                Cleaner sales explanation: the package only makes sense when the customer plans to use enough
                services to cross the break-even point. For the default numbers, that happens during service three.
              </div>
            </>
          )}
        </div>
      );
    }

    function BreakdownTable({ rows }) {
      return (
        <div className="panel table-panel">
          <div className="panel-header">
            <h2>Visit-by-Visit Breakdown</h2>
          </div>

          <div className="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Visit #</th>
                  <th>Prepaid Package</th>
                  <th>Pay-Per-Visit Running Total</th>
                  <th>Savings / Loss</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(row => {
                  const positive = row.savings >= 0;
                  return (
                    <tr key={row.visit} className={row.isBreakEven ? "break-even-row" : ""}>
                      <td>{row.visit === 0 ? "0 (Start)" : row.visit}</td>
                      <td>{money(row.prepaid)}</td>
                      <td>{money(row.payPerVisit)}</td>
                      <td className={positive ? "positive" : "negative"}>
                        {positive ? "+" : ""}
                        {money(row.savings)}
                      </td>
                      <td>
                        {row.isBreakEven
                          ? "Break-even reached"
                          : positive
                            ? "Saving money"
                            : "Still behind"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function App() {
      const [packagePrice, setPackagePrice] = useState("434.56");
      const [perVisitCost, setPerVisitCost] = useState("150.00");

      const data = useMemo(() => {
        const pkg = parseFloat(packagePrice) || 0;
        const ppv = parseFloat(perVisitCost) || 0;

        const valid = pkg >= 0 && ppv > 0;
        const costPerService = valid ? pkg / SERVICE_COUNT : 0;
        const breakEven = valid ? pkg / ppv : Number.NaN;
        const roundUp = valid ? Math.ceil(breakEven) : Number.NaN;
        const totalPayPerVisit = ppv * SERVICE_COUNT;
        const totalSavings = valid ? totalPayPerVisit - pkg : 0;
        const savingsPct = valid && totalPayPerVisit > 0
          ? (totalSavings / totalPayPerVisit) * 100
          : 0;

        const rows = [];

        for (let visit = 0; visit <= SERVICE_COUNT; visit++) {
          const payPerVisit = ppv * visit;
          const savings = payPerVisit - pkg;
          const previousSavings = visit > 0 ? rows[visit - 1].savings : null;

          rows.push({
            visit,
            prepaid: pkg,
            payPerVisit,
            savings,
            isBreakEven: visit > 0 && savings >= 0 && previousSavings < 0
          });
        }

        return {
          pkg,
          ppv,
          valid,
          costPerService,
          breakEven,
          roundUp,
          totalSavings,
          savingsPct,
          rows
        };
      }, [packagePrice, perVisitCost]);

      return (
        <div className="app-shell">
          <Hero breakEven={data.breakEven} roundUp={data.roundUp} />

          <main className="main-card">
            <div className="main-card-inner">
              <div className="section-head">
                <div>
                  <div className="section-kicker">Package Variables</div>
                  <div className="section-title">Adjust the numbers and the analysis updates instantly.</div>
                </div>
                <div className="section-note">
                  Built for a six-service prepaid oil-change package compared against regular pay-per-visit pricing.
                </div>
              </div>

              <section className="input-panel">
                <MoneyField
                  id="package-price"
                  label="6-Service Prepaid Package Price"
                  value={packagePrice}
                  onChange={setPackagePrice}
                />

                <MoneyField
                  id="per-visit-cost"
                  label="Pay-Per-Visit Cost"
                  value={perVisitCost}
                  onChange={setPerVisitCost}
                />
              </section>

              <section className="metrics-grid">
                <MetricCard
                  label="Cost Per Service"
                  value={money(data.costPerService)}
                  subtitle="Effective cost with prepaid package"
                />

                <MetricCard
                  blue
                  label="Break-Even Point"
                  value={Number.isFinite(data.breakEven) ? data.breakEven.toFixed(2) : "—"}
                  subtitle="Visits needed to recover package cost"
                />

                <MetricCard
                  label={data.totalSavings >= 0 ? "Total Savings" : "Total Difference"}
                  value={money(data.totalSavings)}
                  subtitle="Compared with paying for all six visits individually"
                />
              </section>

              <section className="analysis-grid">
                <CostChart
                  rows={data.rows}
                  packagePrice={data.pkg}
                  perVisitCost={data.ppv}
                />

                <Summary
                  breakEven={data.breakEven}
                  roundUp={data.roundUp}
                  costPerService={data.costPerService}
                  totalSavings={data.totalSavings}
                  savingsPct={data.savingsPct}
                  perVisitCost={data.ppv}
                />
              </section>

              <BreakdownTable rows={data.rows} />
            </div>

            <footer className="footer">
              <span>Hendrick Automotive Group · Service Advisor Toolkit</span>
              <span>Six-Service Package Analysis</span>
            </footer>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
